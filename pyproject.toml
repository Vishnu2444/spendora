[project]
name = "leaksee"
version = "1.0.0"
description = "Leaksee — Privacy-First AI Personal Expense Tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
    "flet-charts>=0.1.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.flet]
org = "org.leaksee"
product = "Leaksee"
company = "Leaksee"
copyright = "Copyright (C) 2026 Leaksee"

[tool.flet.app]
path = "."
module = "main"
exclude = [
    "data",
    "tests",
    "docs",
    "requirements-dev.txt",
    "stitch_ai_personal_expense_tracker",
    "web_ui",
    ".pytest_cache",
    ".git",
    "__pycache__",
    "assets/test_icon.png",
    "assets/test_icon_clean.png",
    "assets/leaksee_original.jpg",
]

[tool.flet.cleanup]
app = true
packages = true
app_files = [
    "*.db",
    "*.db-*",
    "*.sqlite",
    "*.sqlite3",
    "*.csv",
    ".env*",
    "*.log",
    ".coverage",
    "htmlcov",
]
package_files = [
    "*.pyi",
    "*.typed",
]

[tool.flet.android]
package = "org.leaksee.leaksee"
build_number = 1
target_arch = ["arm64-v8a"]
permissions = [
    "android.permission.INTERNET",
]
